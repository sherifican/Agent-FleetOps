[project]
name = "fleet_tui"
version = "4.0"
description = "Lightweight Textual monitor/inbox/control window over a local/cloud model fleet"
requires-python = ">=3.11"
dependencies = ["textual>=0.60", "pyte>=0.8", "textual-serve>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
