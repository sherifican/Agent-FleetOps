[project]
name = "fleet_tui"
version = "0.1.0"
description = "Lightweight Textual monitor/inbox/control window over the Fleet fleet stack"
requires-python = ">=3.11"
dependencies = ["textual>=0.60", "textual-plotext>=1.0", "pyte>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
