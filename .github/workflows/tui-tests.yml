name: fleet-ops checks
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r tui/requirements.txt
      - name: Run the hermetic suite
        working-directory: tui
        run: python -m pytest -q
      - name: Guard layer — teeth-prover, contract agreement, unit gates
        run: |
          python3 guard/teeth_prover.py
          python3 guard/contract_agreement.py
          python -m pytest guard/tests/ -q
