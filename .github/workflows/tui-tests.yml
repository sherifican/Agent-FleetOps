name: fleet-ops checks
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r tui/requirements.txt
      - name: Run the hermetic suite
        working-directory: tui
        run: python -m pytest -q
      - name: Guard layer — teeth-prover, contract agreement, unit gates
        run: |
          python3 guard/teeth_prover.py
          python3 guard/contract_agreement.py
          python -m pytest guard/tests/ -q

  ref-gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is critical — the ref gate scans FULL reachable history.
      # At the default depth of 1 it would scan one commit and report "clean", which is
      # the check-that-cannot-fail failure mode this repo exists to argue against.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Ref gate — mutation proof, then the real scan
        run: |
          python3 _tools/ref_gate.py --self-test
          python3 _tools/ref_gate.py .
          # readme_guard asks the INVERSE question from every other gate here: did
          # critical content DISAPPEAR? Deletion passes wall_check/scan_gate/ref_gate and
          # even makes a naming scan greener. A delegated rewrite removed 55 lines on 2026-08-22
          # and every gate went green. (A guard with no caller is a script, not a gate.)
          bash _tools/readme_guard.sh
