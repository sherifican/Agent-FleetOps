<path class="connector" d="M892 336 V368" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M624 392 H576" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M308 432 V464" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M544 432 V448 H600 V528 H624" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M892 592 V624" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M1160 656 H1174 V256 H1080 V272" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M892 432 V464" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<path class="connector" d="M1120 304 H1142 V528 H1120" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow)"/>
<rect x="40" y="1504" width="1120" height="516" rx="14" fill="none" stroke="#e879f9" stroke-width="1.5" stroke-dasharray="8 6"/>
</svg>
